# =============================================================================
# Ajustes para el entorno de PRUEBAS
# =============================================================================
#
# Se aplica encima de docker-compose.yml solo cuando se invoca con:
#
#   docker compose -p virthub-test --env-file .env.test \
#     -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Mueve la aplicacion al puerto 8001 para no chocar con el entorno real, y no
# levanta Caddy ni los Webtop: las pruebas son de la aplicacion, no del proxy.

services:
  app:
    ports:
      - "8001:80"

  # En pruebas no hace falta la puerta de entrada.
  caddy:
    profiles:
      - proxy

  # Ni los escritorios.
  ct0:
    profiles:
      - proxy
