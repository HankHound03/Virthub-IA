services:
  # ---------------------------------------------------------------------------
  # Puerta de entrada unica
  # ---------------------------------------------------------------------------
  # Caddy es el unico servicio que escucha en internet. Antes de entregar un
  # escritorio pregunta a la aplicacion si ese escritorio es del usuario, asi
  # que conocer la URL de un contenedor no sirve de nada sin sesion.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Se publica solo en loopback: el tunel de Cloudflare corre en el host y
      # llega por aqui. No queda expuesto a la red local ni a internet.
      #
      # 8080 en http porque el tunel ya termina el TLS; Caddy no necesita
      # certificados ni salida a internet.
      - "127.0.0.1:${CADDY_PORT:-8080}:8080"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - virthub

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # La aplicacion sigue accesible en este puerto, para no romper el despliegue
    # actual. Caddy la alcanza por la red interna en `app:80`.
    #
    # Cuando confirmes que Caddy sirve bien el dominio, puedes comentar esta
    # linea para que la unica puerta sea Caddy (recomendado en produccion).
    #
    # Se limita a loopback por el mismo motivo que Caddy: sin el 127.0.0.1 queda
    # accesible desde toda la red local en el puerto 8000, saltandose Caddy y sus
    # cabeceras. Es solo para diagnostico desde el propio equipo.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-virthub}
      DB_USERNAME: ${DB_USERNAME:-virthub}
      DB_PASSWORD: ${DB_PASSWORD:-virthub_password}

      # Diseno Redmond: cinco epocas con sus esquemas y sus fondos.
      VIRTHUB_TEMAS: "true"

      # Sin panel de noticias en el inicio.
      VIRTHUB_NOTICIAS: "false"

      # Moderacion de las fotos del foro con NSFW Sherlock.
      VIRTHUB_MODERACION: "true"
      VIRTHUB_MODERACION_URL: "http://nsfw-sherlock:4000"
      VIRTHUB_MODERACION_UMBRAL: "0.75"

      # IA local (Ollama en el equipo, no en el contenedor). Solo el administrador
      # puede usarla: la ruta y el chat con la IA lo comprueban en el servidor.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "virthub-ia"
      OLLAMA_CONNECT_TIMEOUT: "5"
      OLLAMA_REQUEST_TIMEOUT: "300"

      # Monitor de recursos del panel de IA. Si el puente de GPU no esta
      # levantado, el panel oculta esos datos y sigue funcionando.
      VIRTHUB_IA_MONITOR: "true"
      VIRTHUB_GPU_URL: "http://host.docker.internal:11435"
    depends_on:
      mariadb:
        condition: service_healthy
      nsfw-sherlock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/up\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - app_storage:/var/www/html/storage
      # Carpeta del escritorio de invitado, montada para poder borrar su
      # informacion personal al terminar la sesion. La aplicacion corre en otro
      # contenedor y sin este montaje no alcanza esos archivos.
      - ${GUEST_DATA_DIR:-C:\webtop\ct7}:/guest-data
    networks:
      - virthub

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-virthub}
      MARIADB_USER: ${DB_USERNAME:-virthub}
      MARIADB_PASSWORD: ${DB_PASSWORD:-virthub_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - virthub

  # ---------------------------------------------------------------------------
  # Antivirus de los adjuntos
  # ---------------------------------------------------------------------------
  # Escanea todo lo que se sube al foro (y los avatares) ANTES de guardarlo.
  #
  # Se usa ClamAV en local, no un servicio externo, por dos razones:
  #   - los archivos de los usuarios no salen del servidor;
  #   - no hay limite de tamano ni de peticiones (los foros aceptan archivos de
  #     hasta 5 GB por trozos, que un servicio en la nube no admitiria).
  #
  # Consume entre 1 y 2 GB de RAM, casi todo la base de firmas. Si el equipo va
  # justo, se puede apagar con CLAMAV_ENABLED=false y el antivirus se salta.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    environment:
      # Solo se escanean archivos; el filtro de correo no hace falta.
      CLAMAV_NO_MILTERD: "true"
    volumes:
      # La base de firmas se conserva: si no, se descargan ~300 MB en cada
      # arranque.
      - clamav_db:/var/lib/clamav
    # Sin `ports`: solo se llega desde la red interna.
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - virthub
  #
  # Compose no permite generar servicios por iteracion (la clave `range` solo
  # admite valores DENTRO de un servicio, no nombres de servicio), asi que cada
  # escritorio se declara una vez. Para anadir uno: copia un bloque, cambia el
  # nombre/su carpeta, y anade su ruta en docker/Caddyfile.

  ct0:
    # Cambiado a Ubuntu Mate (antes ubuntu-xfce).
    image: lscr.io/linuxserver/webtop:ubuntu-mate
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Mexico_City}
      TITLE: "Escritorio ct0"
    volumes:
      # 647 archivos con el escritorio que ya tenias (antes en C:\webtop\test).
      - ${CONTAINER_DATA_DIR:-C:\webtop}\ct0:/config
    networks:
      - virthub

  ct2:
    image: virthub-desktop:clon
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Mexico_City}
      TITLE: "Escritorio ct2"
    volumes:
      - ${CONTAINER_DATA_DIR:-C:\webtop}\ct2:/config
    networks:
      - virthub

  ct3:
    image: virthub-desktop:clon
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Mexico_City}
      TITLE: "Escritorio ct3"
    volumes:
      - ${CONTAINER_DATA_DIR:-C:\webtop}\ct3:/config
    networks:
      - virthub

  # ct4 era la maquina virtual con Windows (dockurr/windows). Ahora es un
  # escritorio Webtop mas, clon de ct0. La VM de Windows se puede recuperar
  # aparte con docker/windows7.yml si fuera necesaria.
  ct4:
    image: virthub-desktop:clon
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Mexico_City}
      TITLE: "Escritorio ct4"
    volumes:
      - ${CONTAINER_DATA_DIR:-C:\webtop}\ct4:/config
    networks:
      - virthub

  # --- ct5, ct6, ct7 ---------------------------------------------------------
  # Clones de los anteriores: mismo bloque, otra carpeta de datos.
  #
  # Cada uno necesita su PROPIA carpeta (/config): si compartieran una, los dos
  # escribirian sobre el mismo home y se pisarian.
  #
  # Para anadir otro: copia un bloque, cambia el nombre y la carpeta, y anade su
  # ruta en docker/Caddyfile.

  ct5:
    image: virthub-desktop:clon
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Mexico_City}
      TITLE: "Escritorio ct5"
    volumes:
      - ${CONTAINER_DATA_DIR:-C:\webtop}\ct5:/config
    networks:
      - virthub

  ct6:
    image: virthub-desktop:clon
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Mexico_City}
      TITLE: "Escritorio ct6"
    volumes:
      - ${CONTAINER_DATA_DIR:-C:\webtop}\ct6:/config
    networks:
      - virthub

  ct7:
    image: virthub-desktop:clon
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Mexico_City}
      TITLE: "Escritorio ct7"
    volumes:
      - ${CONTAINER_DATA_DIR:-C:\webtop}\ct7:/config
    networks:
      - virthub

  # ---------------------------------------------------------------------------
  # Moderacion de imagenes (NSFW Sherlock)
  # ---------------------------------------------------------------------------
  # Servicio aparte, autoalojado: recibe la foto en base64 y devuelve si es
  # contenido no apto. La aplicacion lo consulta al terminar cada subida de
  # imagen; si la tumbla, borra el archivo y avisa al usuario y al administrador.
  #
  # Sin puerto publicado: solo lo ve la aplicacion, dentro de la red interna.
  nsfw-sherlock:
    image: m1chl/nsfw-sherlock:latest
    restart: unless-stopped
    environment:
      APP_ENV: web
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - virthub

volumes:
  app_storage:
  # Base de firmas de ClamAV: se conserva para no descargarla en cada arranque.
  clamav_db:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  virthub:
    driver: bridge
    # Caddy necesita salida a internet para emitir los certificados TLS, asi que
    # la red NO se marca como `internal`. El aislamiento se consigue no
    # publicando puertos: sin `ports` no hay forma de llegar desde fuera.
    #
    # Si emites los certificados en otro sitio (por ejemplo con Cloudflare
    # Tunnel), puedes marcar `internal: true` y entonces la red no tendra salida
    # alguna: aislamiento total.
