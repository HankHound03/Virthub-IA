; ---------------------------------------------------------------------------
; Configuracion de PHP para Virthub
; ---------------------------------------------------------------------------
;
; La imagen php:8.4-apache no carga ningun php.ini por defecto, asi que PHP
; arranca con sus valores de fabrica: upload_max_filesize = 2M. El resultado era
; que cualquier archivo de mas de 2 MB se descartaba EN SILENCIO (PHP vacia
; $_FILES sin devolver error), de modo que la subida "no ocurria" y la
; validacion de Laravel nunca llegaba a ejecutarse.
;
; Regla importante: post_max_size debe ser MAYOR que upload_max_filesize.
; Si el total del formulario supera post_max_size, PHP descarta todo y
; $_POST y $_FILES quedan vacios.

; --- Subidas ---
file_uploads = On
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 25

; --- Memoria y tiempo ---
; Laravel procesa los adjuntos en el mismo proceso que atiende la peticion.
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; --- Vision de errores ---
; Los errores se registran en storage/logs de Laravel, no en la respuesta HTTP.
display_errors = Off
log_errors = On
error_reporting = E_ALL

; --- Rendimiento ---
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

; --- Zona horaria y codificacion ---
date.timezone = UTC
default_charset = "UTF-8"
