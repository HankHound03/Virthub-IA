; -----------------------------------------------------------------------------
; PHP para el entorno de PRUEBAS
; -----------------------------------------------------------------------------
;
; Se monta solo en docker-compose.test.yml, con un nombre que carga DESPUES de
; zz-virthub.ini para poder sobrescribirlo.
;
; El php.ini de la aplicacion desactiva la comprobacion de fechas:
;
;   opcache.validate_timestamps = 0
;
; Eso esta bien en produccion (mas rapido, y el codigo no cambia), pero en pruebas
; significa que PHP sigue sirviendo la version anterior de cualquier archivo hasta
; que se reinicia el contenedor. Con esto se ve el cambio al recargar.
;
; Solo afecta al rendimiento, no al comportamiento.

opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
